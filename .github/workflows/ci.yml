name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Verify release target contract
        run: |
          grep -q 'x86_64-unknown-linux-musl' .github/workflows/release.yml
          ! grep -q 'x86_64-apple-darwin' .github/workflows/release.yml
          grep -q 'aarch64-apple-darwin' .github/workflows/release.yml
          grep -q 'x86_64-pc-windows-msvc' .github/workflows/release.yml
          grep -q 'environment: macos-release' .github/workflows/release.yml
          grep -q './scripts/sign_and_notarize_macos.sh' .github/workflows/release.yml
          grep -q 'environment: cos-release' .github/workflows/release.yml
          grep -q './scripts/upload-release-to-cos.sh cos-upload webfetch-cli' .github/workflows/release.yml
          grep -q 'needs: \[build-linux, build-macos, build-windows\]' .github/workflows/release.yml
          ! grep -q 'skills/lexmount-webfetch/bin/' .github/workflows/release.yml
      - run: bash -n scripts/sign_and_notarize_macos.sh scripts/upload-release-to-cos.sh
      - run: sh -n scripts/package-skill.sh scripts/package-cli-connector.sh skills/lexmount-webfetch/scripts/bootstrap.sh skills/lexmount-webfetch/scripts/doctor.sh cli-connector/scripts/install.sh
      - name: Verify Skill bootstrap version
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          grep -Fq "else { \"${package_version}\" }" skills/lexmount-webfetch/scripts/bootstrap.ps1
          grep -Fq "LEXMOUNT_WEBFETCH_CLI_VERSION:-${package_version}" skills/lexmount-webfetch/scripts/bootstrap.sh
      - name: Verify Skill platform selection and PATH isolation
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          mkdir -p "$test_dir/skill/scripts" "$test_dir/skill/bin" "$test_dir/fake-path"
          cp skills/lexmount-webfetch/scripts/doctor.sh "$test_dir/skill/scripts/doctor.sh"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*"\n' > "$test_dir/skill/bin/webfetch-cli"
          chmod +x "$test_dir/skill/bin/webfetch-cli"
          ln -s /usr/bin/true "$test_dir/fake-path/webfetch-cli"
          output="$(PATH="$test_dir/fake-path:/usr/bin:/bin" "$test_dir/skill/scripts/doctor.sh")"
          test "$output" = 'doctor --json'
          grep -Fq 'Linux-x86_64) target="x86_64-unknown-linux-musl"' skills/lexmount-webfetch/scripts/bootstrap.sh
          ! grep -q 'command -v webfetch-cli' skills/lexmount-webfetch/scripts/doctor.sh
          ! grep -q 'Get-Command webfetch-cli' skills/lexmount-webfetch/scripts/doctor.ps1
      - name: Verify WorkBuddy Connector contract
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          jq -e '
            .type == "cli" and
            .source == "lexmount-webfetch" and
            .version == "0.1.0" and
            .minWorkbuddyVersion == "5.0.0" and
            (.examples_zh | length >= 2 and length <= 5) and
            (.examples_en | length >= 2 and length <= 5)
          ' cli-connector/connector-meta.json
          jq -e --arg version "$package_version" '
            . as $config |
            .versionCheck.minVersion == $version and
            .statusMatchJson.authenticated == "true" and
            .authUrlDomain == "browser.lexmount.cn" and
            (["darwin", "linux", "win32"] | all(
              . as $platform |
              ($config.init[$platform] | type == "string" and length > 0) and
              ($config.auth[$platform] | type == "string" and length > 0) and
              ($config.unAuth[$platform] | type == "string" and length > 0) and
              ($config.status[$platform] | type == "string" and length > 0) and
              ($config.versionCheck.command[$platform] | type == "string" and length > 0)
            ))
          ' cli-connector/cli.json
          grep -Fq "LEXMOUNT_WEBFETCH_CLI_VERSION:-${package_version}" cli-connector/scripts/install.sh
          grep -Fq "else { \"${package_version}\" }" cli-connector/scripts/install.ps1
          grep -Fq 'version: 0.1.0' cli-connector/skills/lexmount-webfetch/SKILL.md
          grep -Fq 'description_zh:' cli-connector/skills/lexmount-webfetch/SKILL.md
          grep -Fq 'description_en:' cli-connector/skills/lexmount-webfetch/SKILL.md
          grep -Fq 'author: Lexmount' cli-connector/skills/lexmount-webfetch/SKILL.md
          grep -Fq 'Linux-x86_64) target="x86_64-unknown-linux-musl"' cli-connector/scripts/install.sh
      - name: Verify runtime packaging contract
        run: |
          ! grep -R -E 'python3[[:space:]]|python[[:space:]]+-m|uv[[:space:]]' scripts skills cli-connector .github/workflows
      - name: Stage excluded Skill package fixtures
        run: |
          mkdir -p skills/lexmount-webfetch/bin
          printf 'macOS arm64 package fixture' > skills/lexmount-webfetch/bin/webfetch-cli
          printf 'Windows x64 package fixture' > skills/lexmount-webfetch/bin/webfetch-cli.exe
      - run: ./scripts/package-skill.sh
      - run: unzip -t dist/lexmount-webfetch.zip
      - name: Verify SkillHub ZIP root
        run: |
          unzip -Z1 dist/lexmount-webfetch.zip | grep -qx 'SKILL.md'
          ! unzip -Z1 dist/lexmount-webfetch.zip | grep -q '^lexmount-webfetch/'
          ! unzip -Z1 dist/lexmount-webfetch.zip | grep -q '^bin/'
          expected_files="$(printf '%s\n' \
            'SKILL.md' \
            'references/authentication.md' \
            'references/commands.md' \
            'references/troubleshooting.md' \
            'scripts/bootstrap.ps1' \
            'scripts/bootstrap.sh' \
            'scripts/doctor.ps1' \
            'scripts/doctor.sh')"
          test "$(unzip -Z1 dist/lexmount-webfetch.zip)" = "$expected_files"
      - run: ./scripts/package-cli-connector.sh
      - run: unzip -t dist/lexmount-webfetch-cli-connector.zip
      - name: Verify WorkBuddy Connector ZIP root
        run: |
          unzip -Z1 dist/lexmount-webfetch-cli-connector.zip | grep -qx 'connector-meta.json'
          unzip -Z1 dist/lexmount-webfetch-cli-connector.zip | grep -qx 'cli.json'
          unzip -Z1 dist/lexmount-webfetch-cli-connector.zip | grep -qx 'icon.svg'
          if unzip -Z1 dist/lexmount-webfetch-cli-connector.zip | grep -q '^cli-connector/'; then
            echo 'Connector ZIP must not contain an outer cli-connector directory' >&2
            exit 1
          fi
          if unzip -Z1 dist/lexmount-webfetch-cli-connector.zip | grep -q '/bin/'; then
            echo 'Connector ZIP must not contain native binaries' >&2
            exit 1
          fi
          expected_files="$(printf '%s\n' \
            'README.md' \
            'cli.json' \
            'connector-meta.json' \
            'icon.svg' \
            'scripts/install.ps1' \
            'scripts/install.sh' \
            'skills/lexmount-webfetch/SKILL.md' \
            'skills/lexmount-webfetch/references/authentication.md' \
            'skills/lexmount-webfetch/references/commands.md' \
            'skills/lexmount-webfetch/references/troubleshooting.md')"
          test "$(unzip -Z1 dist/lexmount-webfetch-cli-connector.zip)" = "$expected_files"

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bootstrap from COS with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1" }
          $latestTag = git tag --list "v*" --sort=-version:refname | Select-Object -First 1
          if (-not $latestTag) { throw "No published version tag found" }
          $env:LEXMOUNT_WEBFETCH_CLI_VERSION = $latestTag.TrimStart('v')
          $env:LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "webfetch-cli-bootstrap"
          & .\skills\lexmount-webfetch\scripts\bootstrap.ps1
          & (Join-Path $env:LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR "webfetch-cli.exe") version
          $env:LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "webfetch-cli-connector"
          & .\cli-connector\scripts\install.ps1
          & (Join-Path $env:LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR "webfetch-cli.exe") version

  linux-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bootstrap static Linux x64 binary from COS
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          test -n "$latest_tag"
          export LEXMOUNT_WEBFETCH_CLI_VERSION="${latest_tag#v}"
          export LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR="$RUNNER_TEMP/webfetch-cli-bootstrap"
          ./skills/lexmount-webfetch/scripts/bootstrap.sh
          "$LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR/webfetch-cli" version
          export LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR="$RUNNER_TEMP/webfetch-cli-connector"
          ./cli-connector/scripts/install.sh
          "$LEXMOUNT_WEBFETCH_CLI_INSTALL_DIR/webfetch-cli" version

  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify standalone Linux executable
        run: |
          binary="target/x86_64-unknown-linux-musl/release/webfetch-cli"
          if readelf --program-headers --wide "$binary" | grep -F 'Requesting program interpreter'; then
            echo 'Linux release binary is dynamically linked' >&2
            exit 1
          fi
          "$binary" version

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify standalone Windows executable
        shell: powershell
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/webfetch-cli.exe"
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw "webfetch-cli version failed with exit code $LASTEXITCODE" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -property installationPath
          Import-Module "$installationPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installationPath -SkipAutomaticLocation
          $dependencies = & dumpbin.exe /dependents $binary
          $dependencies | Write-Output
          if ($dependencies -match '(?im)^\s+(?:VCRUNTIME|MSVCP)\d*[^\s]*\.dll\s*$') {
            throw "Windows release dynamically depends on the Visual C++ Redistributable"
          }
